name: Test and release

on:
  pull_request:
  push:
    tags:
      - '[0-9]*'
      - 'v[0-9]*'

permissions:
  contents: read

jobs:
  build:
    name: Test and build
    # Match the committed macOS dependency lock and native artifact checksums.
    runs-on: macos-15
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      GRADLE_ARGS: --no-daemon --console=plain
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate release version
        if: github.event_name == 'push'
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          pattern='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-([0-9A-Za-z-]+\.)*[0-9A-Za-z-]+)?(\+([0-9A-Za-z-]+\.)*[0-9A-Za-z-]+)?$'
          if [[ ! "$version" =~ $pattern ]]; then
            echo 'Expected a version tag such as v0.3.3, 0.3.3, or v0.3.3-rc.1.' >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "ORG_GRADLE_PROJECT_releaseVersion=$version" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Download checksum-pinned compile APIs
        run: python3 tools/download_compile_dependencies.py
      - name: Run Java and Python unit tests
        run: make test
      - name: Build release JAR
        if: github.event_name == 'push'
        run: make build
      - name: Preserve release JAR
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: release-jar
          path: build/libs/fourtwenty-${{ steps.version.outputs.version }}.jar
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-jar
          path: release
      - name: Publish mod to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          jar="release/fourtwenty-${RELEASE_VERSION}.jar"
          test -s "$jar"
          options=()
          if [[ "${RELEASE_VERSION%%+*}" == *-* ]]; then
            options+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" "$jar" --verify-tag \
            --title "FourTwenty ${RELEASE_VERSION}" --generate-notes "${options[@]}"
